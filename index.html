<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MIDNIGHT MANIFESTO // CRT TERMINAL</title>
  <style>
    :root {
      --mag: #ff33ff;
      --mag-hi: #ffb3ff;
      --text-bright: #ffe6ff;
      --mag-dim: rgba(255, 85, 255, 0.55);
      --glow: 0 0 4px rgba(255, 255, 255, 0.75), 0 0 10px rgba(255, 51, 255, 0.95), 0 0 22px rgba(255, 0, 255, 0.65);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #0c0014; color: var(--text-bright);
      font-family: "Courier New", Courier, monospace; user-select: none;
    }
    .bg-layer {
      position: fixed; inset: 0; z-index: 1;
      background: url('background.jpg') no-repeat center center fixed;
      background-size: 100% 100%;
      filter: brightness(1.05) contrast(1.18) saturate(1.25);
    }
    .crt-overlay {
      position: fixed; inset: 0; z-index: 10; pointer-events: none;
      background:
        linear-gradient(rgba(24, 16, 28, 0) 50%, rgba(0, 0, 0, 0.26) 50%),
        radial-gradient(circle at center, rgba(255, 102, 255, 0.06) 0%, rgba(0, 0, 0, 0.28) 82%, rgba(0, 0, 0, 0.62) 100%);
      background-size: 100% 4px, 100% 100%;
      animation: flicker 0.15s infinite alternate;
    }
    .crt-overlay::after {
      content: ""; position: absolute; inset: 0; height: 18%; width: 100%;
      background: linear-gradient(to bottom, transparent 0%, rgba(255, 120, 255, 0.1) 50%, transparent 100%);
      animation: roll 7s linear infinite;
    }
    @keyframes flicker { 0% { opacity: 0.96; } 100% { opacity: 1; } }
    @keyframes roll { 0% { transform: translateY(-100%); } 100% { transform: translateY(600%); } }
    .terminal-wrapper {
      position: relative; z-index: 5;
      width: min(92vw, 880px); height: min(82vh, 640px); margin: 5vh auto 0;
      background: rgba(18, 0, 28, 0.68); border: 2px solid var(--mag-hi); border-radius: 14px;
      box-shadow: 0 0 32px rgba(255, 51, 255, 0.55), inset 0 0 35px rgba(255, 51, 255, 0.25);
      backdrop-filter: blur(3px); display: flex; flex-direction: column; overflow: hidden;
    }
    .terminal-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 16px; background: rgba(255, 51, 255, 0.24);
      border-bottom: 1px solid var(--mag-dim); font-size: 0.84rem;
      color: #fff; font-weight: bold; letter-spacing: 1.5px; text-shadow: var(--glow);
    }
    .status-dot {
      display: inline-block; width: 9px; height: 9px; border-radius: 50%;
      background: #fff; box-shadow: var(--glow); margin-right: 8px;
    }
    .terminal-body {
      flex: 1; padding: 20px 24px; overflow-y: auto;
      font-size: 1.06rem; line-height: 1.65; color: var(--text-bright); text-shadow: var(--glow);
    }
    .line { margin-bottom: 8px; word-wrap: break-word; }
    .line.dim { color: #f2a6ff; opacity: 0.95; font-size: 0.94rem; }
    .line.system { color: #ffffff; font-weight: bold; }
    .alien-banner {
      display: flex; align-items: center; gap: 20px; margin: 14px 0; padding: 14px 18px;
      border: 1px dashed var(--mag-hi); background: rgba(255, 51, 255, 0.12); border-radius: 8px;
      box-shadow: inset 0 0 18px rgba(255, 0, 255, 0.2);
    }
    .alien-svg-wrap {
      flex-shrink: 0; width: 78px; height: 92px; display: flex; align-items: center; justify-content: center;
      filter: drop-shadow(0 0 8px #ff33ff) drop-shadow(0 0 18px rgba(255, 0, 255, 0.75));
      animation: float 3.2s ease-in-out infinite;
    }
    .alien-svg-wrap svg { width: 100%; height: 100%; overflow: visible; }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    .welcome-text { color: #ffffff; font-size: 1.08rem; line-height: 1.6; text-shadow: var(--glow); }
    .cmd-chip {
      display: inline-block; color: #fff; background: rgba(255, 51, 255, 0.34);
      border: 1px solid var(--mag-hi); padding: 3px 11px; margin: 4px 6px 4px 0;
      border-radius: 4px; cursor: pointer; font-weight: bold; text-shadow: var(--glow);
      box-shadow: 0 0 10px rgba(255, 0, 255, 0.35);
    }
    .cmd-chip:hover { background: #fff; color: #14001f; text-shadow: none; box-shadow: 0 0 16px #ff66ff; }
    .prompt-row {
      display: none; align-items: center; padding: 12px 24px;
      border-top: 1px solid var(--mag-dim); background: rgba(32, 0, 48, 0.9);
    }
    .prompt-label { color: #fff; font-weight: bold; margin-right: 10px; text-shadow: var(--glow); }
    .prompt-input {
      flex: 1; background: transparent; border: none; outline: none; color: #fff;
      font-family: inherit; font-size: 1.08rem; text-shadow: var(--glow); caret-color: #fff;
    }
    .cursor {
      display: inline-block; width: 10px; height: 1.1em; background: #fff;
      box-shadow: var(--glow); vertical-align: text-bottom; margin-left: 3px; animation: blink 0.8s step-end infinite;
    }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    .corner-logo {
      position: fixed; right: 26px; bottom: 54px; width: clamp(95px, 12vw, 150px);
      opacity: 0.68; z-index: 6; border-radius: 50%; cursor: pointer;
      filter: brightness(1.2) drop-shadow(0 0 18px rgba(255, 51, 255, 0.85)); transition: 0.3s;
    }
    .corner-logo:hover { opacity: 1; transform: scale(1.06); }
    #visualizer { position: fixed; left: 0; bottom: 0; width: 100%; height: 44px; z-index: 4; pointer-events: none; }
    .crt-footer {
      position: fixed; bottom: 8px; left: 0; width: 100%; text-align: center;
      z-index: 7; font-size: 0.82rem; font-weight: bold; letter-spacing: 2px; color: #fff; text-shadow: var(--glow);
    }
    .crt-footer a { color: #ffb3ff; text-decoration: none; border-bottom: 1px dotted #fff; }
  </style>
</head>
<body>
  <div class="bg-layer"></div>
  <div class="crt-overlay"></div>
  <video id="media-player" src="song.mp4" playsinline preload="auto" crossorigin="anonymous" style="display:none;"></video>

  <main class="terminal-wrapper" id="terminal-box">
    <header class="terminal-header">
      <div><span class="status-dot"></span>MIDNIGHT_MANIFESTO // TTY-NODE-01</div>
      <div>BAUD: 28800 // CARRIER: LOCKED</div>
    </header>
    <section class="terminal-body" id="terminal-output"></section>
    <form class="prompt-row" id="prompt-form" autocomplete="off">
      <span class="prompt-label">midnighter@manifesto:~$</span>
      <input type="text" id="cmd-input" class="prompt-input" placeholder="type a command or tap above..." autofocus />
    </form>
  </main>

  <img src="logo.webp" alt="Midnight Manifesto Emblem" class="corner-logo" id="logo-btn" title="Play / Pause Transmission" />
  <canvas id="visualizer"></canvas>
  <footer class="crt-footer">CONTACT: <a id="email-link">[ DECRYPTING... ]</a></footer>

  <script>
    // Set your GitHub username here so /music/ auto-discovery also works on custom domain midnightmanifesto.co
    const GITHUB_USER = "danielsokolowski"; 
    const GITHUB_REPO = "midnightmanifesto.co";

    const DISCORD_URL = "https://discord.gg/3NYQ9qB8";
    const WELCOME_MESSAGE = "Welcome to the Midnight Manifesto. We talk about aliens, philosophy, conspiracies, and anything fringe. Have an open mind and be respectful. No drama. It's ok to agree to disagree. Let's get weird. Welcome Midnighter! ";
    const ENCODED_USER = "Y29udGFjdA==";
    const ENCODED_DOMAIN = "bWlkbmlnaHRtYW5pZmVzdG8uY28=";

    const REALISTIC_GREY_SVG =
      '<svg viewBox="0 0 120 145" xmlns="http://www.w3.org/2000/svg">' +
        '<defs>' +
          '<radialGradient id="craniumGrad" cx="50%" cy="34%" r="58%" fx="44%" fy="26%">' +
            '<stop offset="0%" stop-color="#ffffff"/>' +
            '<stop offset="28%" stop-color="#ff99ff"/>' +
            '<stop offset="68%" stop-color="#cc00cc"/>' +
            '<stop offset="100%" stop-color="#3b0047"/>' +
          '</radialGradient>' +
          '<linearGradient id="neckGrad" x1="0%" y1="0%" x2="100%" y2="100%">' +
            '<stop offset="0%" stop-color="#b300b3" stop-opacity="0.9"/>' +
            '<stop offset="50%" stop-color="#ff66ff" stop-opacity="0.8"/>' +
            '<stop offset="100%" stop-color="#260033" stop-opacity="0.4"/>' +
          '</linearGradient>' +
          '<radialGradient id="eyeVoid" cx="45%" cy="45%" r="55%">' +
            '<stop offset="0%" stop-color="#2a0038"/>' +
            '<stop offset="60%" stop-color="#0d0014"/>' +
            '<stop offset="100%" stop-color="#000000"/>' +
          '</radialGradient>' +
        '</defs>' +
        '<ellipse cx="60" cy="68" rx="54" ry="64" fill="none" stroke="#ff66ff" stroke-width="0.8" stroke-dasharray="4 3" opacity="0.55"/>' +
        '<path d="M46 113 C47 125, 42 134, 36 140 L84 140 C78 134, 73 125, 74 113 Z" fill="url(#neckGrad)" stroke="#ff66ff" stroke-width="1"/>' +
        '<path d="M51 116 L46 138 M69 116 L74 138 M60 118 L60 139" stroke="#ffb3ff" stroke-width="0.9" opacity="0.6"/>' +
        '<path d="M60 6 C22 6, 8 36, 13 69 C16 88, 29 99, 39 109 C46 116, 53 122, 60 122 C67 122, 74 116, 81 109 C91 99, 104 88, 107 69 C112 36, 98 6, 60 6 Z" fill="url(#craniumGrad)" stroke="#ffccff" stroke-width="1.5"/>' +
        '<path d="M60 10 L60 56 M24 34 C34 22, 46 18, 60 18 C74 18, 86 22, 96 34" fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.45"/>' +
        '<path d="M18 62 C26 55, 44 58, 54 68 M102 62 C94 55, 76 58, 66 68" fill="none" stroke="#590066" stroke-width="2.2" opacity="0.75"/>' +
        '<path d="M24 86 C32 95, 42 101, 49 108 M96 86 C88 95, 78 101, 71 108" fill="none" stroke="#ffb3ff" stroke-width="1" opacity="0.55"/>' +
        '<path d="M19 69 C21 57, 36 56, 51 67 C54 70, 53 81, 44 84 C31 87, 18 79, 19 69 Z" fill="url(#eyeVoid)" stroke="#ff99ff" stroke-width="1.4"/>' +
        '<path d="M101 69 C99 57, 84 56, 69 67 C66 70, 67 81, 76 84 C89 87, 102 79, 101 69 Z" fill="url(#eyeVoid)" stroke="#ff99ff" stroke-width="1.4"/>' +
        '<ellipse cx="33" cy="67" rx="7" ry="3.2" transform="rotate(14 33 67)" fill="#ffccf9" opacity="0.75"/>' +
        '<circle cx="42" cy="74" r="1.6" fill="#ffffff" opacity="0.85"/>' +
        '<ellipse cx="87" cy="67" rx="7" ry="3.2" transform="rotate(-14 87 67)" fill="#ffccf9" opacity="0.75"/>' +
        '<circle cx="78" cy="74" r="1.6" fill="#ffffff" opacity="0.85"/>' +
        '<path d="M56 91 L58 96 M64 91 L62 96" stroke="#3b0047" stroke-width="1.6" stroke-linecap="round"/>' +
        '<path d="M50 107 Q60 109 70 107" fill="none" stroke="#4d0059" stroke-width="1.5" stroke-linecap="round"/>' +
        '<path d="M53 107.5 Q60 108.5 67 107.5" fill="none" stroke="#ffb3ff" stroke-width="0.7" opacity="0.7"/>' +
      '</svg>';

    const outputEl = document.getElementById("terminal-output");
    const promptForm = document.getElementById("prompt-form");
    const cmdInput = document.getElementById("cmd-input");
    const terminalBox = document.getElementById("terminal-box");
    const mediaPlayer = document.getElementById("media-player");
    const logoBtn = document.getElementById("logo-btn");
    const canvas = document.getElementById("visualizer");
    const ctx = canvas.getContext("2d");

    (function() {
      const el = document.getElementById("email-link");
      const addr = atob(ENCODED_USER) + "@" + atob(ENCODED_DOMAIN);
      el.textContent = addr.toUpperCase();
      el.href = "mailto:" + addr;
    })();

    // Playlist & GitHub /music/ Auto-Discovery
    let playlist = [{ name: "song.mp4", url: "song.mp4" }];
    let currentTrackIndex = -1;

    async function loadMusicFolder() {
      let user = GITHUB_USER;
      if (!user && window.location.hostname.endsWith(".github.io")) {
        user = window.location.hostname.split(".")[0];
      }
      if (!user) return;
      try {
        const res = await fetch("https://api.github.com/repos/" + user + "/" + GITHUB_REPO + "/contents/music");
        if (!res.ok) return;
        const files = await res.json();
        if (Array.isArray(files)) {
          const tracks = files
            .filter(f => f.type === "file" && /\.(mp4|mp3|wav|ogg|webm|m4a)$/i.test(f.name))
            .map(f => ({ name: f.name, url: "music/" + encodeURIComponent(f.name) }));
          if (tracks.length > 0) playlist = tracks;
        }
      } catch (e) {}
    }
    loadMusicFolder();

    function formatTitle(filename) {
      return filename.replace(/\.[^/.]+$/, "").replace(/[-_]/g, " ").toUpperCase();
    }

    function playTrack(trackObj) {
      initVis();
      mediaPlayer.src = trackObj.url;
      mediaPlayer.play().then(() => {
        printLine('>> STREAMING TRANSMISSION: "' + formatTitle(trackObj.name) + '" [SIGNAL ACTIVE] &#128266;', "line system");
      }).catch((err) => {
        printLine(">> AUDIO ERROR: " + err.message, "line");
      });
    }

    function playRandomTrack() {
      if (playlist.length === 0) return;
      let idx = Math.floor(Math.random() * playlist.length);
      if (playlist.length > 1 && idx === currentTrackIndex) {
        idx = (idx + 1) % playlist.length;
      }
      currentTrackIndex = idx;
      playTrack(playlist[idx]);
    }

    mediaPlayer.addEventListener("ended", () => {
      playRandomTrack();
    });

    let audioCtx = null, analyser = null, sourceNode = null, visActive = false;
    function ensureAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();
    }
    function beep(freq = 680, dur = 0.018, type = "square", vol = 0.02) {
      if (!audioCtx || audioCtx.state !== "running") return;
      try {
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.type = type; o.frequency.setValueAtTime(freq, audioCtx.currentTime);
        g.gain.setValueAtTime(vol, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(); o.stop(audioCtx.currentTime + dur);
      } catch (e) {}
    }
    function initVis() {
      ensureAudio();
      if (!sourceNode) {
        try {
          analyser = audioCtx.createAnalyser(); analyser.fftSize = 128;
          sourceNode = audioCtx.createMediaElementSource(mediaPlayer);
          sourceNode.connect(analyser); analyser.connect(audioCtx.destination);
        } catch (e) {}
      }
      if (!visActive) { visActive = true; drawVis(); }
    }
    function resize() { canvas.width = window.innerWidth; canvas.height = 44; }
    window.addEventListener("resize", resize); resize();
    function drawVis() {
      requestAnimationFrame(drawVis);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (!analyser || mediaPlayer.paused) return;
      const len = analyser.frequencyBinCount, data = new Uint8Array(len);
      analyser.getByteFrequencyData(data);
      const bw = (canvas.width / len) * 1.4; let x = 0;
      for (let i = 0; i < len; i++) {
        const bh = (data[i] / 255) * canvas.height;
        ctx.fillStyle = i % 2 === 0 ? "rgba(255,85,255,0.92)" : "rgba(255,23,110,0.92)";
        ctx.fillRect(x, canvas.height - bh, bw - 2, bh); x += bw;
      }
    }

    function printLine(html, cls = "line") {
      const d = document.createElement("div"); d.className = cls; d.innerHTML = html;
      outputEl.appendChild(d); outputEl.scrollTop = outputEl.scrollHeight;
    }
    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

    async function runBoot() {
      const steps = [
        ["ATZ // INITIALIZING MODEM...", 450, "line dim"],
        ["ATDT 555-0199 // DIALING NODE: MIDNIGHT-MANIFESTO...", 700, "line dim"],
        ["HANDSHAKE: 28.8k BAUD... CARRIER DETECTED [OK]", 600, "line dim"],
        ["BYPASSING MAINSTREAM FILTERS... SIGNAL LOCKED.", 500, "line system"]
      ];
      for (const [txt, ms, cls] of steps) {
        printLine(txt, cls); beep(520, 0.04, "sawtooth", 0.025); await sleep(ms);
      }
      const b = document.createElement("div"); b.className = "alien-banner";
      b.innerHTML = '<div class="alien-svg-wrap">' + REALISTIC_GREY_SVG + '</div><div class="welcome-text"><span id="tw"></span><span class="cursor" id="bc"></span></div>';
      outputEl.appendChild(b);
      const tw = document.getElementById("tw"), bc = document.getElementById("bc");
      for (let i = 0; i < WELCOME_MESSAGE.length; i++) {
        tw.textContent += WELCOME_MESSAGE[i];
        if (i % 2 === 0) beep(740 + (i % 5) * 30, 0.012, "square", 0.015);
        outputEl.scrollTop = outputEl.scrollHeight;
        const c = WELCOME_MESSAGE[i];
        await sleep((c === "." || c === "!") ? 160 : (c === "," ? 80 : 25));
      }
      if (bc) bc.remove();
      await sleep(250);
      printMenu();
      promptForm.style.display = "flex"; cmdInput.focus();
    }

    function printMenu() {
      printLine(
        'AVAILABLE COMMANDS (TYPE BELOW OR TAP TO EXECUTE):<br/>' +
        '<span class="cmd-chip" data-cmd="play song">[ play song ]</span>' +
        '<span class="cmd-chip" data-cmd="ls /music">[ ls /music ]</span>' +
        '<span class="cmd-chip" data-cmd="join discord">[ join discord ]</span>' +
        '<span class="cmd-chip" data-cmd="stop">[ stop ]</span>' +
        '<span class="cmd-chip" data-cmd="contact">[ contact ]</span>' +
        '<span class="cmd-chip" data-cmd="help">[ help ]</span>',
        "line system"
      );
    }

    async function execCmd(raw) {
      const cmd = raw.trim().toLowerCase(); if (!cmd) return;
      ensureAudio(); beep(880, 0.03, "square", 0.03);
      printLine("midnighter@manifesto:~$ " + raw, "line dim");
      if (cmd === "play song" || cmd === "play" || cmd === "next" || cmd === "1") {
        await loadMusicFolder();
        playRandomTrack();
      } else if (cmd === "ls /music" || cmd === "ls music" || cmd === "ls" || cmd === "dir") {
        await loadMusicFolder();
        let out = ">> DIRECTORY LISTING OF /music/ (" + playlist.length + " TRACKS FOUND):<br/>";
        playlist.forEach((t, i) => {
          out += '<span class="cmd-chip" data-track="' + i + '">[' + (i + 1) + '] ' + t.name + '</span>';
        });
        printLine(out, "line system");
      } else if (cmd === "stop" || cmd === "pause") {
        mediaPlayer.pause(); printLine(">> TRANSMISSION PAUSED.", "line");
      } else if (cmd === "join discord" || cmd === "discord" || cmd === "join" || cmd === "2") {
        printLine(">> ROUTING TO #rules-guidelines... LAUNCHING DISCORD PORTAL &#128760;", "line system");
        window.open(DISCORD_URL, "_blank", "noopener,noreferrer");
      } else if (cmd === "contact" || cmd === "email") {
        const d = atob(ENCODED_USER) + "@" + atob(ENCODED_DOMAIN);
        printLine('>> DIRECT COMM: <a href="mailto:' + d + '" style="color:#fff;">' + d + '</a>', "line system");
      } else if (cmd === "alien" || cmd === "weird") {
        printLine(">> &#128125; [CLASSIFIED]: THE SIGNAL IS COMING FROM INSIDE THE GARDEN.", "line system");
      } else if (cmd === "clear" || cmd === "cls") {
        outputEl.innerHTML = ""; printMenu();
      } else if (cmd === "help" || cmd === "?") {
        printMenu();
      } else {
        printLine('>> UNKNOWN COMMAND. Type <span class="cmd-chip" data-cmd="play song">play song</span> or <span class="cmd-chip" data-cmd="ls /music">ls /music</span>.', "line");
      }
    }

    promptForm.addEventListener("submit", (e) => {
      e.preventDefault(); const v = cmdInput.value; cmdInput.value = ""; execCmd(v);
    });
    outputEl.addEventListener("click", (e) => {
      const c = e.target.closest(".cmd-chip");
      if (!c) return;
      if (c.dataset.cmd) {
        execCmd(c.dataset.cmd);
      } else if (c.dataset.track !== undefined) {
        const idx = parseInt(c.dataset.track, 10);
        if (playlist[idx]) {
          currentTrackIndex = idx;
          playTrack(playlist[idx]);
        }
      }
    });
    terminalBox.addEventListener("click", (e) => {
      ensureAudio(); if (!e.target.closest(".cmd-chip")) cmdInput.focus();
    });
    logoBtn.addEventListener("click", () => execCmd(mediaPlayer.paused ? "play song" : "stop"));
    window.addEventListener("DOMContentLoaded", runBoot);
  </script>
</body>
</html>
